{% extends "base.html" %}{% block title %}Register | CyberTechVision{% endblock %}{% block page_heading %}Create Account{% endblock %}
{% block content %}<section class="auth-wrap"><form class="panel auth-panel" method="post"><div class="eyebrow">JOIN THE WORKSPACE</div><h1>Create your account</h1><label>Full name</label><input name="name" required placeholder="Your name"><label>Email address</label><input type="email" name="email" required placeholder="you@example.com"><label>Password</label><input type="password" name="password" minlength="6" required placeholder="At least 6 characters"><button class="btn primary full" type="submit">Create account →</button><p class="muted">Already registered? <a href="{{ url_for('login') }}">Login</a></p></form></section>{% endblock %}
